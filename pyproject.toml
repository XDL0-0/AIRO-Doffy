[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airo-doffy"
version = "2.0.0.dev0"
description = "Modular VR teleoperation, data collection, and policy runtime for UR and RealMan robots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
config = [
  "PyYAML>=6.0",
]
math = [
  "loguru>=0.7",
  "numpy>=1.24",
  "scipy>=1.10",
]
camera-realsense = [
  "airo-camera-toolkit",
  "opencv-python>=4.8",
  "pyrealsense2>=2.54",
]
video-h264 = [
  "av>=12",
  "numpy>=1.24",
]
video-jpeg = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]
video-webrtc = [
  "aiohttp>=3.9",
  "aiortc>=1.9",
  "av>=12",
  "numpy>=1.24",
]
robot-ur = [
  "airo-robots[ur]",
  "airo-spatial-algebra",
  "ruckig",
  "ur-analytic-ik",
]
robot-realman = [
  "airo-robots[realman]",
  "airo-spatial-algebra",
  "ruckig",
]
tactile-ble4 = [
  "numpy>=1.24",
  "sensor-comm-dds",
]
tactile-legacy = [
  "loguru>=0.7",
  "numpy>=1.24",
  "pyserial>=3.5",
  "sensor-comm-dds",
]
recording = [
  "av>=12",
  "h5py>=3.10",
  "huggingface-hub",
  "lerobot",
]
policy = [
  "huggingface-hub",
  "lerobot",
  "torch",
]
visualization = [
  "matplotlib>=3.8",
  "opencv-python>=4.8",
  "rerun-sdk",
]
dev = [
  "build",
  "pyright",
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["airo_doffy*"]

[tool.setuptools.package-data]
airo_doffy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
