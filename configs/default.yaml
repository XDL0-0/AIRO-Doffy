    "save_eef": false,
    "data_type": "both"
  },
  "visualization": {
    "enabled": true,
    "hz": 30.0,
    "window_s": 8.0,
    "force_panel_range": 30.0
  },
  "video": {
    "transport": "webrtc",
    "jpeg_quality": 100,
    "legacy_chunk_size": 60000,
    "encoder_backend": "auto",
