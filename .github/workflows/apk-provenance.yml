name: APK provenance

on:
  pull_request:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the provenance guard
        run: python -m unittest discover -s tests -p test_apk_release.py -v
      - name: Require APK identity and pinned Unity source metadata
        run: python scripts/check_apk_release.py
