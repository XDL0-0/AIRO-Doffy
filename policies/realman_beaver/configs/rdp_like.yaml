dataset:
  root: /home/yuyuan/AIRO-Doffy/datasets/WRM_grasp_lero
  repo_id: WRM_grasp_lero
  video_backend: pyav
  fps: 24
  image_key: observation.images.camera_0
  image_shape: [3, 480, 640]
  state_key: observation.state
  action_key: action
  beaver_distance_key: observation.beaver.distance_mm
  beaver_present_key: observation.beaver.present
  beaver_status_key: observation.beaver.target_status
  beaver_valid_statuses: [5, 9]
  val_fraction: 0.1
  split_seed: 42
  normalization_source: parquet
  distance_max_mm: 2550.0
  normalization_floor: 0.0001

model:
  variant: rdp_like
  state_dim: 7
  action_dim: 7
  beaver_shape: [9, 4, 4]
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8
  vision_backbone: resnet18
  resize_shape: [128, 128]
  crop_ratio: 0.9
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  num_inference_steps: 100
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
  clip_sample_range: 1.0

rdp:
  # All RDP settings below follow the reference repository exactly:
  # AT 601 epochs / batch 64 / max_train_steps null (full dataloader each
  # epoch), LDP 401 epochs / batch 64 / max_train_steps null, downsample 2
  # (32 actions -> 16 latent tokens), n_latent_dims 4, rnn_latent_dims 32,
  # LDP sampling with the full 100-step DDPM schedule.
  action_horizon: 32
  downsample_ratio: 2
  latent_dim: 4
  tokenizer_hidden_dim: 32
  tokenizer_layers: 1
  beaver_feature_dim: 32
  kl_weight: 0.000001
  slow_observation_stride: 2
  slow_replan_steps: 8
  latent_down_dims: [256, 512, 1024]
  latent_kernel_size: 3
  latent_num_inference_steps: 100
  latent_noise_scheduler_type: DDPM
  tokenizer_epochs: 601
  tokenizer_max_steps: null
  tokenizer_batch_size: 64
  tokenizer_learning_rate: 0.001
  tokenizer_weight_decay: 0.0001
  latent_epochs: 401
  latent_max_steps: null
  latent_batch_size: 64
  tokenizer_checkpoint: null

training:
  output_dir: outputs/realman_beaver/rdp_like
  device: auto
  seed: 42
  batch_size: 8
  num_workers: 4
  epochs: 200
  # null: RDP stages run every epoch to completion (601 tokenizer epochs,
  # 401 latent-DP epochs) instead of being capped at a step count.
  max_steps: null
  learning_rate: 0.0001
  weight_decay: 0.000001
  betas: [0.95, 0.999]
  eps: 0.00000001
  warmup_steps: 500
  gradient_clip_norm: 1.0
  amp: true
  ema_decay: 0.999
  log_every_steps: 20
  checkpoint_every_steps: 25000
  resume_from: null
