dataset:
  root: /home/yuyuan/AIRO-Doffy/datasets/WRM_grasp_cylinder_different_sizes_lero_tightness
  repo_id: WRM_grasp_cylinder_different_sizes_lero_tightness
  video_backend: pyav
  fps: 24
  image_key: observation.images.camera_0
  image_shape: [3, 480, 640]
  state_key: observation.state
  action_key: action
  beaver_distance_key: observation.beaver.distance_mm
  beaver_present_key: observation.beaver.present
  beaver_status_key: observation.beaver.target_status
  beaver_sensor_layout: ["00", "01", "02", "03", "04", "10", "11", "12", "13"]
  beaver_valid_statuses: [5, 9]
  val_fraction: 0.0
  # Final production fit: use all 125 episodes and hold out no validation set.
  val_episodes: null
  split_seed: 42
  normalization_source: parquet
  distance_max_mm: 2550.0
  normalization_floor: 0.0001

model:
  variant: rdp_like
  state_dim: 7
  action_dim: 7
  beaver_shape: [9, 4, 4]
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8
  vision_backbone: resnet18
  resize_shape: [128, 128]
  crop_ratio: 0.9
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  num_inference_steps: 100
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
  clip_sample_range: 1.0

rdp:
  action_horizon: 32
  downsample_ratio: 2
  latent_dim: 4
  tokenizer_hidden_dim: 32
  tokenizer_layers: 1
  beaver_feature_dim: 32
  beaver_sensors: ["01", "02", "10", "11"]
  kl_weight: 0.000001
  slow_observation_stride: 2
  slow_replan_steps: 8
  latent_down_dims: [256, 512, 1024]
  latent_kernel_size: 3
  latent_num_inference_steps: 100
  latent_noise_scheduler_type: DDPM
  tokenizer_epochs: 601
  tokenizer_max_steps: null
  tokenizer_batch_size: 32
  tokenizer_learning_rate: 0.001
  tokenizer_weight_decay: 0.0001
  latent_epochs: 401
  latent_max_steps: null
  latent_batch_size: 32
  tokenizer_checkpoint: null

training:
  output_dir: outputs/realman_beaver/rdp_like_key4_all_train
  device: auto
  seed: 42
  batch_size: 32
  num_workers: 8
  epochs: 200
  # Cap both tokenizer and latent-DP stages at the current 100k-step budget.
  max_steps: 100000
  learning_rate: 0.0001
  weight_decay: 0.000001
  betas: [0.95, 0.999]
  eps: 0.00000001
  warmup_steps: 500
  gradient_clip_norm: 1.0
  amp: true
  ema_decay: 0.999
  log_every_steps: 20
  checkpoint_every_steps: 25000
  resume_from: null
  wandb_project: AIRO-Doffy-WRM-Grasp
  wandb_run_name: WRM_grasp_cylinder_different_sizes_lero_tightness/rdp_like_key4-all125-bs32
